name: Analyze Skill-5 wins draws losses with Stockfish 19
on:
  push:
    paths:
      - '.github/launch-skill5-forensic.txt'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: gm1000-skill5-forensic-study
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements and verify code integrity
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          python -m py_compile scripts/analyze_skill5_losses.py
      - name: Retrieve all original PGN games from Skill-5 tournament run 41195883523
        uses: actions/download-artifact@v4
        with:
          name: gm1000-stockfish-skill5-four-tournaments
          run-id: 41195883523
          repository: allam775/gm-1000-chess-engine
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/original-skill5
      - name: Install verified official Stockfish 19 evaluation engine
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            -o "$RUNNER_TEMP/sf19.tar.gz"
          mkdir -p "$RUNNER_TEMP/sf19"
          tar -xzf "$RUNNER_TEMP/sf19.tar.gz" -C "$RUNNER_TEMP/sf19"
          bin=$(find "$RUNNER_TEMP/sf19" -type f -name 'stockfish*' ! -name '*.txt' ! -name '*.md' | head -n 1)
          test -n "$bin"
          chmod +x "$bin"
          printf 'uci\nquit\n' | "$bin" | grep '^id name Stockfish 19'
          echo "STOCKFISH_PATH=$bin" >> "$GITHUB_ENV"
      - name: Compute every move's independent candidate and played-move evaluations
        run: python scripts/analyze_skill5_losses.py --analysis-seconds 0.08
      - name: Publish diagnostic artifacts, including full original PGNs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-skill5-forensic-win-loss-comparison
          path: |
            reports/original-skill5/tournament-*/matches.pgn
            reports/skill5-forensic/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist original PGNs and verified forensic results in GitHub
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/skill5-original-pgn
          for n in 01 02 03 04; do
            cp "reports/original-skill5/tournament-$n/matches.pgn" "data/skill5-original-pgn/tournament-$n.pgn"
          done
          cp reports/skill5-forensic/forensic_summary.json data/skill5_forensic_summary.json
          cp reports/skill5-forensic/all_moves.json data/skill5_forensic_all_moves.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skill5-original-pgn/ data/skill5_forensic_summary.json data/skill5_forensic_all_moves.json
          git commit -m 'Audit wins vs losses with Stockfish19 move-by-move evaluation'
          git push