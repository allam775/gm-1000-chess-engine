name: GM-1000 v0.5 train position evaluator and benchmark
on:
  push:
    paths:
      - '.github/launch-learned-eval-v05.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm1000-v05-learned-evaluator
  cancel-in-progress: false
jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install train-time dependencies, run baseline regression suite
        run: |
          python -m pip install -r requirements.txt pytest numpy
          python -m pytest -q
      - name: Install pinned official Stockfish 19 teacher
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz'
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 300 "$url" -o "$RUNNER_TEMP/stockfish19.tar.gz"
          mkdir -p "$RUNNER_TEMP/stockfish19"
          tar -xzf "$RUNNER_TEMP/stockfish19.tar.gz" -C "$RUNNER_TEMP/stockfish19"
          bin=$(find "$RUNNER_TEMP/stockfish19" -type f -name 'stockfish*' ! -name '*.md' ! -name '*.txt' | head -n 1)
          test -n "$bin"
          chmod +x "$bin"
          printf 'uci\nquit\n' | "$bin" | grep '^id name Stockfish 19'
          echo "STOCKFISH_PATH=$bin" >> "$GITHUB_ENV"
      - name: Supervise unfamiliar positions from 400-game PGN with Stockfish 19 scores
        run: |
          python scripts/train_eval_v05.py \
            --seconds 0.03 --max-positions 10000 --ridge 70
      - name: Re-check model integration regression suite
        run: python -m pytest -q
      - name: Validate playing strength on paired openings, all memories OFF
        run: |
          python scripts/benchmark_eval_v05.py --games 16 --skill 5 --seconds-per-move 0.2
      - name: Preserve candidate, train report, PGNs and A/B reports even if validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-v05-training-and-holdout-benchmark
          path: |
            data/learned_eval_v05_candidate.json
            data/learned_eval_v05_training_report.json
            reports/v05-evaluator-benchmark/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish candidate and evidence; never enable without strength promotion
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp reports/v05-evaluator-benchmark/summary.json data/learned_eval_v05_benchmark_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/learned_eval_v05_candidate.json data/learned_eval_v05_training_report.json data/learned_eval_v05_benchmark_report.json
          git commit -m 'Publish v0.5 Stockfish19-trained position evaluator candidate and independent A/B evidence'
          git fetch origin main
          git rebase origin/main
          git push