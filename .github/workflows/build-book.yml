name: Study 1000 master games
on:
  push:
    paths:
      - '.github/bootstrap-build-book.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - name: Download source archives and select master games
        run: python scripts/build_book.py --limit 1000
      - name: Verify selection and counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          book=json.loads(Path('data/opening_book.json').read_text())
          index=json.loads(Path('data/selection_index.json').read_text())
          assert book['selected_games']==index['selected']==1000
          assert len(index['items'])==1000
          assert len({r['fingerprint_sha256'] for r in index['items']})==1000
          print('verified', book['position_count'], 'opening positions')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: selected-master-games
          path: |
            data/selected_1000.pgn
            data/opening_book.json
            data/selection_index.json
          retention-days: 7
      - name: Commit derived opening book and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/opening_book.json data/selection_index.json
          if ! git diff --cached --quiet; then
            git commit -m 'Build GM-1000 opening book from 1000 selected games'
            git push
          fi
