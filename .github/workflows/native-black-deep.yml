name: Deep confirmation of GM-1000 Black loss critical moves
on:
  push:
    paths:
      - '.github/launch-native-black-deep.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm1000-native-black-deep
  cancel-in-progress: false
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Install official Stockfish 19
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --max-time 300 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            -o "$RUNNER_TEMP/sf19.tar.gz"
          mkdir -p "$RUNNER_TEMP/sf19"
          tar -xzf "$RUNNER_TEMP/sf19.tar.gz" -C "$RUNNER_TEMP/sf19"
          bin=$(find "$RUNNER_TEMP/sf19" -type f -name 'stockfish*' ! -name '*.txt' ! -name '*.md' | head -n 1)
          test -n "$bin"
          chmod +x "$bin"
          echo "STOCKFISH_PATH=$bin" >> "$GITHUB_ENV"
      - name: Reevaluate every first major Black loss error at deeper search
        run: python -m scripts.confirm_native_black_v06 --stockfish "$STOCKFISH_PATH" --seconds 1.0
      - name: Archive verified deep analysis even on publishing failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-native-black-critical-deep-review
          path: data/native_v06_black_deep_review.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit independent deep evaluation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/native_v06_black_deep_review.json
          git commit -m 'Recheck native Black critical errors with deeper Stockfish19'
          git fetch origin main
          git rebase origin/main
          git push
