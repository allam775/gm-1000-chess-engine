name: GM-1000 experimental tactical v0.7 versus frozen v0.6
on:
  push:
    branches:
      - experiment/native-tactical-v07
    paths:
      - '.github/launch-native-tactical-v07.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm1000-native-tactical-v07
  cancel-in-progress: false
jobs:
  paired-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Frozen baseline must be present in local history.
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify baseline branch, dependencies and Python fallback
        run: |
          set -e
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          git cat-file -e 0d5568e39c643a657d669b320e9463359bab06be:native/gm1000.cpp
      - name: Compile candidate and frozen baseline with same compiler options
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/bin build/baseline
          g++ -std=c++17 -O3 -DNDEBUG -pthread -Wall -Wextra -Werror \
            -I native/third_party native/gm1000.cpp -o native/bin/gm1000-native
          git show 0d5568e39c643a657d669b320e9463359bab06be:native/gm1000.cpp > build/baseline/gm1000.cpp
          g++ -std=c++17 -O3 -DNDEBUG -pthread -Wall -Wextra -Werror \
            -I native/third_party build/baseline/gm1000.cpp -o build/baseline/gm1000-baseline
          test "$(sha256sum build/baseline/gm1000.cpp | cut -d' ' -f1)" != "$(sha256sum native/gm1000.cpp | cut -d' ' -f1)"
      - name: Verify native candidate legal moves and promotion rules
        run: python -m pytest -q tests/test_native_core.py tests/test_native_tactical_v07.py
      - name: Run direct paired-opening 32-game candidate versus baseline tournament
        run: |
          python -m scripts.benchmark_native_tactical_v07 \
            --pairs 16 --seed 26103171 --seconds .2 --max-plies 220
      - name: Preserve original PGNs, progress, scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-tactical-v07-versus-frozen-native-v06
          path: reports/native-tactical-v07/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish experiment diagnostics to candidate branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp reports/native-tactical-v07/summary.json data/native_tactical_v07_ab_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/native_tactical_v07_ab_report.json
          git commit -m 'Record tactical v0.7 A/B evidence; keep v0.6 unchanged'
          git fetch origin experiment/native-tactical-v07
          git rebase origin/experiment/native-tactical-v07
          git push origin HEAD:experiment/native-tactical-v07