name: GM-1000 post-400-game four Stockfish 0 tournaments
on:
  push:
    paths:
      - '.github/launch-post400-four.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm1000-post400-stockfish0-four
  cancel-in-progress: false
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies and run all engine tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Install Stockfish Skill Level 0 opponent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Four tournaments (2 overlay enabled, 2 disabled)
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: |
          python scripts/run_four_stockfish19_tournaments.py \
            --tournaments 4 --games-per-tournament 4 --skill 0 \
            --seconds-per-move 0.2 --max-plies 300
      - name: Upload PGN games and per-tournament audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-post400-four-tournaments
          path: reports/stockfish19-memory-four/
          retention-days: 30
          if-no-files-found: warn
      - name: Commit new report separately from the old baseline
        if: success()
        run: |
          cp reports/stockfish19-memory-four/summary.json data/stockfish19_memory_four_tournaments_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stockfish19_memory_four_tournaments_report.json
          git commit -m 'Record post-Stockfish19-study four-tournament A/B test'
          git push
