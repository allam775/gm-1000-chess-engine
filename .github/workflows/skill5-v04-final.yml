name: GM-1000 v0.4 final near-position Skill5 validation
on:
  push:
    paths:
      - '.github/launch-v04-final-skill5.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm1000-v04-final-skill5
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Test full final source
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Use identical Stockfish Skill5 opponent
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          echo 'STOCKFISH_PATH=/usr/games/stockfish' >> "$GITHUB_ENV"
      - name: Run 16 games with both memories and corrected generalization
        run: |
          python scripts/run_stockfish5_four_tournaments.py \
            --tournaments 4 --games-per-tournament 4 --skill 5 \
            --seconds-per-move 0.2 --max-plies 300
      - name: Archive PGNs even when report publishing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-v04-final-16-skill5
          path: reports/stockfish-skill5-four/
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve independent final outcome
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cp reports/stockfish-skill5-four/summary.json data/skill5_v04_final_validation_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/skill5_v04_final_validation_report.json
          git commit -m 'Record final v0.4 pattern recall Skill5 validation'
          git fetch origin main
          git rebase origin/main
          git push
