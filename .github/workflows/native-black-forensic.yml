name: Forensic study of GM-1000 native Black losses
on:
  push:
    paths:
      - '.github/launch-native-black-forensic.txt'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: gm1000-native-black-forensic
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify code and engine tests
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
          python -m py_compile scripts/analyze_native_black_v06.py
      - name: Fetch all forty authentic PGN games
        uses: actions/download-artifact@v4
        with:
          name: gm1000-native-v06-stockfish5-40games
          run-id: 41203570679
          repository: allam775/gm-1000-chess-engine
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/native-40-source
      - name: Install verified official Stockfish 19 for independent review
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 30 --max-time 300 \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz \
            -o "$RUNNER_TEMP/sf19.tar.gz"
          mkdir -p "$RUNNER_TEMP/sf19"
          tar -xzf "$RUNNER_TEMP/sf19.tar.gz" -C "$RUNNER_TEMP/sf19"
          bin=$(find "$RUNNER_TEMP/sf19" -type f -name 'stockfish*' ! -name '*.txt' ! -name '*.md' | head -n 1)
          test -n "$bin"
          chmod +x "$bin"
          printf 'uci\nquit\n' | "$bin" | grep '^id name Stockfish 19'
          echo "STOCKFISH_PATH=$bin" >> "$GITHUB_ENV"
      - name: Evaluate Black losses versus wins and White controls
        run: |
          python -m scripts.analyze_native_black_v06 --stockfish "$STOCKFISH_PATH" --seconds 0.035
      - name: Preserve original games and detailed forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-native-black-losses-forensic
          path: |
            reports/native-40-source/native-matches.pgn
            reports/native-black-forensic/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish concise verified report to GitHub
        if: success()
        run: |
          cp reports/native-black-forensic/summary.json data/native_v06_black_forensic_summary.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/native_v06_black_forensic_summary.json
          git commit -m 'Investigate ten native GM1000 losses playing Black'
          git fetch origin main
          git rebase origin/main
          git push