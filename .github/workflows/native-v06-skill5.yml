name: GM-1000 native vs Python Stockfish Skill5 paired A/B
on:
  push:
    paths:
      - '.github/launch-native-skill5-v06.txt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gm1000-native-v06-skill5
  cancel-in-progress: false
jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify Python and native engine
        run: |
          python -m pip install -r requirements.txt pytest
          mkdir -p native/bin
          g++ -std=c++17 -O3 -DNDEBUG -pthread -Wall -Wextra -Werror \
            -I native/third_party native/gm1000.cpp -o native/bin/gm1000-native
          python -m pytest -q
      - name: Install fixed opponent Stockfish Skill Level 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          echo 'STOCKFISH_PATH=/usr/games/stockfish' >> "$GITHUB_ENV"
      - name: Independent paired-opening Skill5 A/B (16 games per version)
        run: |
          python -m scripts.benchmark_native_skill5_v06 --pairs 8 --seconds 0.2 --max-plies 220
      - name: Upload all PGNs, partial progress and scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-native-v06-stockfish-skill5-32games
          path: reports/native-v06-skill5/
          retention-days: 90
          if-no-files-found: warn
      - name: Record independent Skill5 evaluation, never promote automatically
        if: success()
        run: |
          cp reports/native-v06-skill5/summary.json data/native_v06_skill5_ab_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/native_v06_skill5_ab_report.json
          git commit -m 'Audit v0.6 native versus Python engines against Skill5'
          git fetch origin main
          git rebase origin/main
          git push
