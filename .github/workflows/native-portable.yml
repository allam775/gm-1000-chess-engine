name: Build portable GM-1000 native chess engine (Linux and Windows)
on:
  push:
    paths:
      - 'native/CMakeLists.txt'
      - 'native/gm1000.cpp'
      - 'native/third_party/chess.hpp'
      - 'tests/test_native_core.py'
      - '.github/workflows/native-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile C++17 engine on native runner
        shell: bash
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --config Release --parallel 2
          mkdir -p native/bin
          if [ "${{ runner.os }}" = Windows ]; then
            cp build/native/Release/gm1000-native.exe native/bin/gm1000-native.exe
          else
            cp build/native/gm1000-native native/bin/gm1000-native
          fi
      - name: Cross-check legal chess moves, mate and UCI
        shell: bash
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests/test_native_core.py -q
      - name: Publish experimental engine binaries
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-native-${{ runner.os }}-v06
          path: native/bin/gm1000-native*
          retention-days: 30