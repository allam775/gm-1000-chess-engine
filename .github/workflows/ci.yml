name: Engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install requirements
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m compileall -q engine scripts tests
      - name: Run test suite
        run: python -m pytest -q
