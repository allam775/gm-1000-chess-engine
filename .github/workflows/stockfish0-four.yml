name: Four Stockfish Skill 0 memory comparison tournaments
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/launch-stockfish0-four.txt'
permissions:
  contents: write
concurrency:
  group: gm1000-stockfish0-four-comparison
  cancel-in-progress: false
jobs:
  tournaments:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python packages
        run: python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        run: python -m pytest -q
      - name: Install Stockfish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
      - name: Run four fixed-setting mini-tournaments
        env:
          STOCKFISH_PATH: /usr/games/stockfish
        run: python scripts/run_four_tournaments.py --tournaments 4 --games-per-tournament 4 --skill 0 --seconds-per-move 0.2
      - name: Upload every tournament PGN and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-four-stockfish0-results
          path: reports/stockfish0-four/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish audited four-tournament results
        if: success()
        run: |
          cp reports/stockfish0-four/summary.json data/stockfish0_four_tournaments_report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stockfish0_four_tournaments_report.json
          git commit -m 'Record four Skill-0 Stockfish memory comparison tournaments'
          git push
