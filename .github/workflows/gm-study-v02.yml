name: GM-1000 v0.2 study 200 grandmaster games
on:
  workflow_dispatch:
    inputs:
      games:
        description: 'Distinct titled-GM games to analyze (minimum 200)'
        required: true
        default: '200'
        type: string
  push:
    paths:
      - '.github/launch-gm-study-v02.txt'
permissions:
  contents: write
concurrency:
  group: gm1000-v02-game-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check all engine and learning tests
        run: python -m pytest -q
      - name: Analyze 200 titled-grandmaster games and fit candidate weights
        run: |
          python scripts/study_gm_games.py --games "${{ inputs.games || '200' }}" --epochs 8 --positions-per-game 10
      - name: Enforce game minimum, game-disjoint holdout and no promotion
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d = json.loads(Path('reports/gm-study-v02/report.json').read_text())
          assert d['selected_unique_games'] >= 200
          assert d['train_games'] + d['holdout_games'] == d['selected_unique_games']
          assert d['holdout_game_ids_sha256'] != d['train_game_ids_sha256']
          assert d['train_position_samples'] > 0 and d['holdout_position_samples'] > 0
          print('Approved-model file is not changed by the study')
          print('Verified completed GM game analysis:', d['selected_unique_games'])
          print('Held-out GM-move imitation comparison:', d['holdout_control'], d['holdout_candidate'])
          print('Candidate NOT approved: independent paired playing-strength tests are still required')
          PY
      - name: Upload complete audit trail (reports, candidate, selected-game index)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gm1000-v02-gm200-analysis
          path: reports/gm-study-v02/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit study report and unapproved candidate only
        if: success()
        run: |
          mkdir -p data/candidates
          cp reports/gm-study-v02/candidate.json data/candidates/gm200-v02-candidate.json
          cp reports/gm-study-v02/report.json data/gm_study_report_v02.json
          cp reports/gm-study-v02/selected_games.json data/gm_study_game_index_v02.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates/gm200-v02-candidate.json data/gm_study_report_v02.json data/gm_study_game_index_v02.json
          git commit -m 'Analyze 200 titled GM games; archive unapproved v0.2 candidate' || exit 0
          git push
